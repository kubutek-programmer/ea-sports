<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Color Randomizer</title>
<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #222;
    color: white;
}

canvas {
    margin-top: 20px;
    border: 1px solid #555;
    max-width: 90%;
}

button, input {
    margin: 10px;
    padding: 10px 20px;
}
</style>
</head>
<body>

<h2>Image Color Randomizer</h2>

<input type="file" id="upload" accept="image/*">
<br>
<button id="randomize" disabled>Randomize Colors</button>
<button id="download" disabled>Download</button>

<br>
<canvas id="canvas"></canvas>

<script>
const upload = document.getElementById("upload");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const randomizeBtn = document.getElementById("randomize");
const downloadBtn = document.getElementById("download");

upload.addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        randomizeBtn.disabled = false;
        downloadBtn.disabled = true;
    };
    img.src = URL.createObjectURL(file);
});

function randomColor() {
    return [
        Math.floor(Math.random() * 256),
        Math.floor(Math.random() * 256),
        Math.floor(Math.random() * 256)
    ];
}

randomizeBtn.addEventListener("click", () => {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;

    const colorMap = new Map();

    for (let i = 0; i < data.length; i += 4) {
        const a = data[i + 3];

        // Leave fully transparent pixels untouched
        if (a === 0) continue;

        const key = `${data[i]},${data[i+1]},${data[i+2]}`;

        if (!colorMap.has(key)) {
            colorMap.set(key, randomColor());
        }

        const c = colorMap.get(key);
        data[i]     = c[0];
        data[i + 1] = c[1];
        data[i + 2] = c[2];
    }

    ctx.putImageData(imageData, 0, 0);

    console.log(`Randomized ${colorMap.size} unique colors.`);
    downloadBtn.disabled = false;
});

downloadBtn.addEventListener("click", () => {
    canvas.toBlob(blob => {
        if (!blob) return;

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = url;
        link.download = "randomized.png";
        link.click();

        // Free the blob URL after the download starts.
        setTimeout(() => URL.revokeObjectURL(url), 100);
    }, "image/png");
});
</script>

</body>
</html>
